name: PixelBridge
options:
  bundleIdPrefix: io.github.cooljoes
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PixelBridge:
    type: application
    platform: iOS
    sources:
      - path: PixelBridge
        excludes: ["**/.gitkeep", "App/Info.plist", "App/PixelBridge.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cooljoes.PixelBridge
        INFOPLIST_FILE: PixelBridge/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: PixelBridge/App/PixelBridge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PixelBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PixelBridgeTests]
    dependencies:
      - target: PixelBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PixelBridgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PixelBridgeUITests]
    dependencies:
      - target: PixelBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PixelBridge:
    build:
      targets:
        PixelBridge: all
    test:
      targets: [PixelBridgeTests, PixelBridgeUITests]
